// Shairport Sync configuration for Pi Audio Controller.
// Deployed to /etc/shairport-sync.conf by setup/update.sh.

general =
{
    name = "Raspberry";
    interpolation = "soxr";
    drift_tolerance_in_seconds = 0.002;
    resync_threshold_in_seconds = 0.050;
    ignore_volume_control = "no";
    // Buffer to survive bursty/congested 2.4GHz WiFi delivery on Pi 3B.
    // Output goes straight to the ALSA hardware device (see /etc/asound.conf,
    // no dmix), so shairport-sync manages the hardware buffer itself. Keep this
    // below the AirPlay stream latency ceiling (~2.0s) with a scheduling margin.
    // NOTE: these audio_backend_* settings belong in `general`, not `alsa`,
    // otherwise shairport-sync silently ignores them and uses the 0.2s default.
    audio_backend_buffer_desired_length_in_seconds = 1.7;
    // Slightly larger interpolation threshold avoids constant micro-resyncs.
    audio_backend_buffer_interpolation_threshold_in_seconds = 0.1;
    // Zero offset — shairport-sync drives the hardware timing directly.
    audio_backend_latency_offset_in_seconds = 0;
};

sessioncontrol =
{
    session_timeout = 20;
    run_this_before_play_begins = "/usr/bin/echo playing > /var/lib/pi-audio-controller/shairport-playback-state";
    run_this_after_play_ends = "/usr/bin/echo stopped > /var/lib/pi-audio-controller/shairport-playback-state";
    run_this_if_an_unfixable_error_is_detected = "/usr/bin/echo stopped > /var/lib/pi-audio-controller/shairport-playback-state";
    wait_for_completion = "no";
};

metadata =
{
    enabled = "yes";
};

alsa =
{
    output_device = "default";
    mixer_control_name = "Speaker";
};

diagnostics =
{
    log_verbosity = 1;
};
