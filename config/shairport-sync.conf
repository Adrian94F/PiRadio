// Shairport Sync configuration for Pi Audio Controller.
// Deployed to /etc/shairport-sync.conf by setup/update.sh.

general =
{
    name = "Raspberry";
    interpolation = "soxr";
    drift_tolerance_in_seconds = 0.002;
    resync_threshold_in_seconds = 0.050;
    ignore_volume_control = "no";
};

sessioncontrol =
{
    session_timeout = 20;
};

metadata =
{
    enabled = "yes";
};

alsa =
{
    output_device = "default";
    mixer_control_name = "Speaker";
    // Large buffer to survive WiFi stalls on Pi 3B (shared USB bus).
    // 4 seconds gives enough headroom for bursty packet delivery.
    audio_backend_buffer_desired_length_in_seconds = 4.0;
    // Slightly larger interpolation threshold avoids constant micro-resyncs.
    audio_backend_buffer_interpolation_threshold_in_seconds = 0.1;
};

// Zero offset — dmix handles hardware timing via asound.conf.
audio_backend_latency_offset = 0;

diagnostics =
{
    log_verbosity = 1;
};
